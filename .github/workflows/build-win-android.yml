name: Build Windows & Android (my fork)

# 手动触发：Actions 页面 -> 选这个 workflow -> Run workflow
# 会调用官方 flutter-build.yml，但强制 upload-artifact: true，
# 因此构建产物会上传到 Actions 的 Artifacts 里可直接下载。
#
# 依赖的仓库 Secrets（Settings -> Secrets and variables -> Actions）：
#   ANDROID_SIGNING_KEY         : keystore 的 base64（F:\keys\android_signing_key.txt）
#   ANDROID_ALIAS               : rustdesk
#   ANDROID_KEY_STORE_PASSWORD  : keystore 密码
#   ANDROID_KEY_PASSWORD        : key 密码
#
# 说明：Android 的 "Upload Artifacts" 步骤带 `ANDROID_SIGNING_KEY != null` 条件，
# 没有上面这个 secret 的话 APK 不会被上传（会退化成"发布未签名 APK 到 Release"并失败）。
# Windows 的产物上传只依赖 upload-artifact，不需要 secret。
#
# 官方 Windows 产物是「便携版目录」(rustdesk-unsigned-windows-<arch>)。
# 官方生成单文件安装包 .exe 的那一步被 `SIGN_BASE_URL != '-2'` 挡住（没配签名证书就跳过），
# 所以这里用官方同样的方式自己补上：
#   package-windows  -> 便携版 zip
#   pack-installer   -> 单文件 exe（等价于官方 rustdesk-<ver>-install.exe）
#
# 两个打包 job 都用 `always()`：官方 flutter-build 里只要有一个平台 job 卡死/被取消，
# 整个 run 会被判成 cancelled 并连坐跳过依赖它的 job。用 always() 可以让打包照常进行，
# 拿不到产物时只发 warning，不把整个 run 弄红。

on:
  workflow_dispatch:
    inputs:
      windows-arch:
        description: "要打包的 Windows 架构"
        type: choice
        default: x86_64
        options:
          - x86_64
          - aarch64
          - x86
      package-windows:
        description: "构建后打包 Windows 便携版 zip"
        type: boolean
        default: true
      pack-installer:
        description: "构建后生成单文件安装包 exe"
        type: boolean
        default: true

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: nightly

  package-windows:
    name: package windows portable zip
    needs: build
    if: ${{ always() && inputs.package-windows }}
    runs-on: windows-2022
    steps:
      - name: Checkout (拿版本号)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Read version from Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=' | Select-Object -First 1
          $v = ($line.Line -split '"')[1]
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version = $v"

      - name: Download Windows portable artifact
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rustdesk-unsigned-windows-${{ inputs.windows-arch }}
          path: _win

      - name: Warn and stop if artifact missing
        if: ${{ steps.dl.outcome != 'success' }}
        shell: pwsh
        run: |
          Write-Host "::warning::没有取到 rustdesk-unsigned-windows-${{ inputs.windows-arch }}，跳过打包（Windows 构建可能没跑到或失败了）"

      - name: Locate packaged app directory
        id: locate
        if: ${{ steps.dl.outcome == 'success' }}
        shell: pwsh
        run: |
          # 不假设产物层级：GitHub 上传目录时会把目录「内容」放到产物根，
          # 所以 rustdesk.exe 可能在 _win/ 下，也可能在 _win/rustdesk/ 下。
          $exe = Get-ChildItem -Path _win -Filter rustdesk.exe -Recurse -File |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error::在 _win 下找不到 rustdesk.exe，产物结构与预期不符"
            Get-ChildItem -Recurse -Depth 3 _win | Select-Object -First 40 FullName
            exit 1
          }
          $dir = $exe.Directory.FullName
          "appdir=$dir" >> $env:GITHUB_OUTPUT
          Write-Host "找到 exe : $($exe.FullName)"
          Write-Host "应用目录 : $dir"
          Write-Host "目录内容 :"
          Get-ChildItem $dir | Select-Object -First 20 Name, Length

      - name: Create portable zip
        if: ${{ steps.locate.outcome == 'success' }}
        shell: pwsh
        run: |
          $src = '${{ steps.locate.outputs.appdir }}'
          $name = "rustdesk-${{ steps.ver.outputs.version }}-windows-${{ inputs.windows-arch }}-portable.zip"
          Compress-Archive -Path $src -DestinationPath $name -CompressionLevel Optimal
          Write-Host "created $name ($([math]::Round((Get-Item $name).Length/1MB,2)) MB)"
          Write-Host "zip 内顶层条目："
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $name))
          $zip.Entries | Select-Object -First 8 -ExpandProperty FullName | Write-Host
          $zip.Dispose()

      - name: Upload portable zip
        if: ${{ steps.locate.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-windows-${{ inputs.windows-arch }}-portable.zip
          path: rustdesk-${{ steps.ver.outputs.version }}-windows-${{ inputs.windows-arch }}-portable.zip
          if-no-files-found: error
          retention-days: 30

  pack-installer:
    name: pack single-file installer exe
    needs: build
    if: ${{ always() && inputs.pack-installer }}
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # 必须带上子模块：libs/hbb_common 是根 workspace 的 member，
          # 缺了它 cargo 会报 "failed to load manifest for workspace member ... base ... hbb_common"
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install Python deps
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r libs/portable/requirements.txt

      - name: Read version from Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=' | Select-Object -First 1
          $v = ($line.Line -split '"')[1]
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version = $v"

      - name: Download Windows portable artifact
        id: dl2
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # 单文件安装包用 x86_64 作为载荷，与官方 x86_64 安装包一致
          name: rustdesk-unsigned-windows-x86_64
          path: _win

      - name: Warn and stop if artifact missing
        if: ${{ steps.dl2.outcome != 'success' }}
        shell: pwsh
        run: |
          Write-Host "::warning::没有取到 rustdesk-unsigned-windows-x86_64，跳过单文件打包"

      - name: Locate packaged app directory
        id: locate2
        if: ${{ steps.dl2.outcome == 'success' }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path _win -Filter rustdesk.exe -Recurse -File |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error::在 _win 下找不到 rustdesk.exe"
            Get-ChildItem -Recurse -Depth 3 _win | Select-Object -First 40 FullName
            exit 1
          }
          "appdir=$($exe.Directory.FullName)" >> $env:GITHUB_OUTPUT
          "exepath=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "找到 exe : $($exe.FullName)"
          Get-ChildItem $exe.Directory.FullName | Select-Object -First 15 Name, Length

      - name: Generate blob + build portable packer
        id: gen
        continue-on-error: true
        if: ${{ steps.locate2.outcome == 'success' }}
        shell: pwsh
        working-directory: libs/portable
        env:
          APP_DIR: ${{ steps.locate2.outputs.appdir }}
          APP_EXE: ${{ steps.locate2.outputs.exepath }}
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "python  : $((Get-Command python -ErrorAction SilentlyContinue).Source)"
          Write-Host "cargo   : $((Get-Command cargo -ErrorAction SilentlyContinue).Source)"
          Write-Host "APP_DIR : $env:APP_DIR"
          Write-Host "APP_EXE : $env:APP_EXE"
          Write-Host "cwd     : $(Get-Location)"
          Remove-Item Env:\CARGO_TARGET_DIR -ErrorAction SilentlyContinue

          # generate.py 把 cargo 调用硬编码成 `cargo build --locked --release`。
          # 官方 CI 构建主程序时会重新生成根 Cargo.lock，导致 --locked 校验失败而秒退。
          # 这里用单引号字符串（PowerShell 里 '' 表示一个 "）写入一个补丁脚本，
          # 不改上游文件本身；不用 here-string，避免闭合符顶格要求破坏 YAML 缩进。
          $patch = 'import io; p="generate.py"; s=io.open(p,encoding="utf-8").read(); old=''\"cargo\", "build", "--locked", "--release"''; new=''\"cargo\", "build", "--release"''; io.open(p,"w",encoding="utf-8",newline="").write(s.replace(old,new)) if old in s else None; print("[patch] locked/" + str(old in s))'
          Set-Content -Path patch_locked.py -Value $patch -Encoding utf8
          python ./patch_locked.py 2>&1 | Write-Host
          Write-Host "--- generate.py 里的 cargo 调用现在是 ---"
          Select-String -Path generate.py -Pattern 'cmd = \[' | ForEach-Object { Write-Host $_.Line.Trim() }

          Write-Host "`n--- 运行 generate.py ---"
          python ./generate.py -f "$env:APP_DIR" -o . -e "$env:APP_EXE" 2>&1 |
            Tee-Object -FilePath gen.log
          $code = $LASTEXITCODE
          Write-Host "`n--- generate.py 退出码: $code ---"

          Write-Host "`n--- libs/portable 目录内容 ---"
          Get-ChildItem | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "--- 找 rustdesk-portable-packer.exe（仓库根 target 优先） ---"
          $packer = @(
            '..\..\target\release\rustdesk-portable-packer.exe',
            '.\target\release\rustdesk-portable-packer.exe'
          ) | ForEach-Object { if (Test-Path $_) { Get-Item $_ } } | Select-Object -First 1
          if (-not $packer) {
            $packer = Get-ChildItem -Path ..\..\target, .\target -Filter 'rustdesk-portable-packer.exe' `
                      -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          if ($code -eq 0 -and $packer) {
            Copy-Item $packer.FullName "../../rustdesk-${{ steps.ver.outputs.version }}-x86_64-install.exe" -Force
            $f = "../../rustdesk-${{ steps.ver.outputs.version }}-x86_64-install.exe"
            Write-Host "::notice::created $f ($([math]::Round((Get-Item $f).Length/1MB,2)) MB)"
            "ok=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "packer 路径: $(if ($packer) { $packer.FullName } else { '未找到' })"
            if (Test-Path gen.log) {
              Write-Host "`n--- generate.py 日志末尾 40 行 ---"
              Get-Content gen.log -Tail 40 | Write-Host
            }
            Write-Host "::error::单文件安装包生成失败（退出码 $code）。Windows 便携版 zip 与 APK 不受影响。"
            "ok=false" >> $env:GITHUB_OUTPUT
          }

      - name: Upload installer exe
        if: ${{ steps.gen.outputs.ok == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-windows-x86_64-install.exe
          path: rustdesk-${{ steps.ver.outputs.version }}-x86_64-install.exe
          if-no-files-found: error
          retention-days: 30
