name: Build Windows & Android (my fork)

# 手动触发：Actions 页面 -> 选这个 workflow -> Run workflow
# 会调用官方 flutter-build.yml，但强制 upload-artifact: true，
# 因此构建产物会上传到 Actions 的 Artifacts 里可直接下载。
#
# 依赖的仓库 Secrets（Settings -> Secrets and variables -> Actions）：
#   ANDROID_SIGNING_KEY         : keystore 的 base64（F:\keys\android_signing_key.txt）
#   ANDROID_ALIAS               : rustdesk
#   ANDROID_KEY_STORE_PASSWORD  : keystore 密码
#   ANDROID_KEY_PASSWORD        : key 密码
#
# 说明：Android 的 "Upload Artifacts" 步骤带 `ANDROID_SIGNING_KEY != null` 条件，
# 没有上面这个 secret 的话 APK 不会被上传（会退化成"发布未签名 APK 到 Release"并失败）。
# Windows 的产物上传只依赖 upload-artifact，不需要 secret。
#
# 官方 Windows 产物是「便携版目录」(rustdesk-unsigned-windows-<arch>)。
# 官方生成单文件安装包 .exe 的那一步被 `SIGN_BASE_URL != '-2'` 挡住（没配签名证书就跳过），
# 所以这里用官方同样的方式自己补上：
#   package-windows  -> 便携版 zip
#   pack-installer   -> 单文件 exe（等价于官方 rustdesk-<ver>-install.exe）
#
# 两个打包 job 都用 `always()`：官方 flutter-build 里只要有一个平台 job 卡死/被取消，
# 整个 run 会被判成 cancelled 并连坐跳过依赖它的 job。用 always() 可以让打包照常进行，
# 拿不到产物时只发 warning，不把整个 run 弄红。

on:
  workflow_dispatch:
    inputs:
      windows-arch:
        description: "要打包的 Windows 架构"
        type: choice
        default: x86_64
        options:
          - x86_64
          - aarch64
          - x86
      package-windows:
        description: "构建后打包 Windows 便携版 zip"
        type: boolean
        default: true
      pack-installer:
        description: "构建后生成单文件安装包 exe"
        type: boolean
        default: true

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: nightly

  package-windows:
    name: package windows portable zip
    needs: build
    if: ${{ always() && inputs.package-windows }}
    runs-on: windows-2022
    steps:
      - name: Checkout (拿版本号)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Read version from Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=' | Select-Object -First 1
          $v = ($line.Line -split '"')[1]
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version = $v"

      - name: Download Windows portable artifact
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rustdesk-unsigned-windows-${{ inputs.windows-arch }}
          path: _pkg

      - name: Warn and stop if artifact missing
        if: ${{ steps.dl.outcome != 'success' }}
        shell: pwsh
        run: |
          Write-Host "::warning::没有取到 rustdesk-unsigned-windows-${{ inputs.windows-arch }}，跳过打包（Windows 构建可能没跑到或失败了）"

      - name: Verify packaged exe exists
        if: ${{ steps.dl.outcome == 'success' }}
        shell: pwsh
        run: |
          if (-not (Test-Path '_pkg/rustdesk/rustdesk.exe')) {
            Write-Host "::error::未找到 _pkg/rustdesk/rustdesk.exe，产物结构与预期不符"
            Get-ChildItem -Recurse -Depth 2 _pkg | Select-Object -First 40 FullName
            exit 1
          }
          Write-Host "便携版内容一览："
          Get-ChildItem _pkg/rustdesk | Select-Object -First 15 Name, Length

      - name: Create portable zip
        if: ${{ steps.dl.outcome == 'success' }}
        shell: pwsh
        run: |
          $name = "rustdesk-${{ steps.ver.outputs.version }}-windows-${{ inputs.windows-arch }}-portable.zip"
          Compress-Archive -Path '_pkg/rustdesk' -DestinationPath $name -CompressionLevel Optimal
          Write-Host "created $name ($([math]::Round((Get-Item $name).Length/1MB,2)) MB)"

      - name: Upload portable zip
        if: ${{ steps.dl.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-windows-${{ inputs.windows-arch }}-portable.zip
          path: rustdesk-${{ steps.ver.outputs.version }}-windows-${{ inputs.windows-arch }}-portable.zip
          if-no-files-found: error
          retention-days: 30

  pack-installer:
    name: pack single-file installer exe
    needs: build
    if: ${{ always() && inputs.pack-installer }}
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install Python deps
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r libs/portable/requirements.txt

      - name: Read version from Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=' | Select-Object -First 1
          $v = ($line.Line -split '"')[1]
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version = $v"

      - name: Download Windows portable artifact
        id: dl2
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # 单文件安装包用 x86_64 作为载荷，与官方 x86_64 安装包一致
          name: rustdesk-unsigned-windows-x86_64
          path: rustdesk

      - name: Warn and stop if artifact missing
        if: ${{ steps.dl2.outcome != 'success' }}
        shell: pwsh
        run: |
          Write-Host "::warning::没有取到 rustdesk-unsigned-windows-x86_64，跳过单文件打包"

      - name: Generate blob + build portable packer
        if: ${{ steps.dl2.outcome == 'success' }}
        shell: pwsh
        working-directory: libs/portable
        run: |
          if (-not (Test-Path '../../rustdesk/rustdesk/rustdesk.exe')) {
            Write-Host "::error::未找到 ../../rustdesk/rustdesk/rustdesk.exe"
            Get-ChildItem -Recurse -Depth 2 ../../rustdesk | Select-Object -First 30 FullName
            exit 1
          }
          # generate.py 会写 data.bin / app_metadata.toml 并自己 cargo build 出 rustdesk-portable-packer.exe
          python ./generate.py -f ../../rustdesk/rustdesk -o . -e ../../rustdesk/rustdesk/rustdesk.exe
          if (-not (Test-Path './target/release/rustdesk-portable-packer.exe')) {
            Write-Host "::error::打包器未生成"
            exit 1
          }
          Copy-Item './target/release/rustdesk-portable-packer.exe' `
            "../../rustdesk-${{ steps.ver.outputs.version }}-x86_64-install.exe" -Force
          $f = "../../rustdesk-${{ steps.ver.outputs.version }}-x86_64-install.exe"
          Write-Host "created $f ($([math]::Round((Get-Item $f).Length/1MB,2)) MB)"

      - name: Upload installer exe
        if: ${{ steps.dl2.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-windows-x86_64-install.exe
          path: rustdesk-${{ steps.ver.outputs.version }}-x86_64-install.exe
          if-no-files-found: error
          retention-days: 30
